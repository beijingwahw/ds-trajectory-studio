name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: |
          for f in $(find src data tests -name '*.js'); do node --check "$f"; done

      - name: Unit tests
        run: node --test tests/

      - name: Typecheck & Lint
        run: |
          npm ci --ignore-scripts || npm install --ignore-scripts
          npx tsc
          npx eslint src tests data
